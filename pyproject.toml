[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-iceberg-snowflake-platform"
version = "0.1.0"
description = "Modern Data Lakehouse with Apache Iceberg, Snowflake External Volumes & OpenMetadata"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.1",
    "pyarrow>=16.0.0",
    "loguru>=0.7.2",
    "typer>=0.12.3",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-boto3>=1.34.0",
    "pyspark>=3.5.1",
]

[project.scripts]
ingest-klines = "ingestion.jobs.ingest_binance_klines:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "governance*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
