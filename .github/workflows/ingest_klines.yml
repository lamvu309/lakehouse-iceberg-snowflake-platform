name: Ingest Binance Klines → S3 Iceberg

on:
  # ── 1. Manual trigger từ GitHub UI ──────────────────────────────────
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Trading pair (e.g. BTCUSDT, ETHUSDT)'
        required: true
        default: 'BTCUSDT'
      interval:
        description: 'Kline interval (1m, 5m, 1h, 1d)'
        required: true
        default: '1m'
        type: choice
        options: ['1m', '5m', '15m', '1h', '4h', '1d']
      start_date:
        description: 'Start date (YYYY-MM-DD UTC)'
        required: true
        default: '2024-01-01'
      end_date:
        description: 'End date (YYYY-MM-DD UTC)'
        required: true
        default: '2024-01-31'
      mode:
        description: 'Write mode'
        required: true
        default: 'upsert'
        type: choice
        options: ['upsert', 'append']

  # ── 2. Scheduled: chạy hàng ngày lúc 1AM UTC (ingestion hôm qua) ───
  schedule:
    - cron: '0 1 * * *'

  # ── 3. Push lên main: chỉ chạy nếu ingestion code thay đổi ─────────
  push:
    branches: [main]
    paths:
      - 'ingestion/**'
      - '.github/workflows/ingest_klines.yml'

permissions:
  id-token: write   # Bắt buộc cho AWS OIDC
  contents: read

env:
  PYTHON_VERSION: '3.11'
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  ingest:
    name: Ingest ${{ inputs.symbol || 'BTCUSDT' }} ${{ inputs.interval || '1m' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── Setup ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Java 11 (required for PySpark)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      # ── AWS Authentication via OIDC (no long-lived credentials) ───────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-Ingest-${{ github.run_id }}

      # ── Download Spark JARs (cached between runs) ──────────────────────
      - name: Cache Spark JARs
        uses: actions/cache@v4
        id: jar-cache
        with:
          path: jars/
          key: spark-jars-iceberg-1.5.2-hadoop-3.3.4-sdk-1.12.262

      - name: Download Spark JARs (if not cached)
        if: steps.jar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p jars
          curl -L -o jars/iceberg-spark-runtime.jar \
            "https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.5.2/iceberg-spark-runtime-3.5_2.12-1.5.2.jar"
          curl -L -o jars/hadoop-aws.jar \
            "https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar"
          curl -L -o jars/aws-java-sdk-bundle.jar \
            "https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar"

      # ── Resolve run parameters ──────────────────────────────────────────
      - name: Resolve ingestion parameters
        id: params
        run: |
          # Manual trigger: dùng inputs từ workflow_dispatch
          # Scheduled trigger: ingest ngày hôm qua tự động
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "symbol=${{ inputs.symbol }}"        >> $GITHUB_OUTPUT
            echo "interval=${{ inputs.interval }}"    >> $GITHUB_OUTPUT
            echo "start_date=${{ inputs.start_date }}" >> $GITHUB_OUTPUT
            echo "end_date=${{ inputs.end_date }}"    >> $GITHUB_OUTPUT
            echo "mode=${{ inputs.mode }}"            >> $GITHUB_OUTPUT
          else
            # Scheduled/push: ingest dữ liệu ngày hôm qua
            YESTERDAY=$(date -u -d 'yesterday' '+%Y-%m-%d')
            echo "symbol=BTCUSDT"        >> $GITHUB_OUTPUT
            echo "interval=1m"           >> $GITHUB_OUTPUT
            echo "start_date=$YESTERDAY" >> $GITHUB_OUTPUT
            echo "end_date=$YESTERDAY"   >> $GITHUB_OUTPUT
            echo "mode=upsert"           >> $GITHUB_OUTPUT
          fi

      # ── Unit Tests ─────────────────────────────────────────────────────
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      # ── Ingestion ──────────────────────────────────────────────────────
      - name: Run ingestion
        env:
          ICEBERG_WAREHOUSE: ${{ secrets.S3_ICEBERG_WAREHOUSE }}
          SPARK_LOG_LEVEL: WARN
        run: |
          echo "📊 Ingesting: ${{ steps.params.outputs.symbol }} ${{ steps.params.outputs.interval }}"
          echo "📅 Period: ${{ steps.params.outputs.start_date }} → ${{ steps.params.outputs.end_date }}"
          echo "✏️  Mode: ${{ steps.params.outputs.mode }}"

          python -m ingestion.jobs.ingest_binance_klines \
            --symbol "${{ steps.params.outputs.symbol }}" \
            --interval "${{ steps.params.outputs.interval }}" \
            --start-date "${{ steps.params.outputs.start_date }}" \
            --end-date "${{ steps.params.outputs.end_date }}" \
            --mode "${{ steps.params.outputs.mode }}"

      # ── Verify data on S3 ──────────────────────────────────────────────
      - name: Verify data written to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          echo "🔍 Checking S3 Iceberg files..."
          aws s3 ls "s3://${S3_BUCKET}/iceberg/binance/klines/" --recursive \
            | tail -10

      # ── Notify on failure ─────────────────────────────────────────────
      - name: Report failure summary
        if: failure()
        run: |
          echo "❌ Ingestion FAILED"
          echo "Symbol: ${{ steps.params.outputs.symbol }}"
          echo "Period: ${{ steps.params.outputs.start_date }} → ${{ steps.params.outputs.end_date }}"
          echo "Check the logs above for details."
